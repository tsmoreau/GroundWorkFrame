openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Groundwork small business boilerplate API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Lead management
  - name: clients
    description: Client management
  - name: jobs
    description: Job management
  - name: invoices
    description: Invoice management
  - name: dashboard
    description: Dashboard summaries
  - name: settings
    description: Business settings

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/upcoming-jobs:
    get:
      operationId: getUpcomingJobs
      tags: [dashboard]
      summary: Get jobs scheduled in the next 14 days
      responses:
        "200":
          description: Upcoming jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

  /dashboard/outstanding-invoices:
    get:
      operationId: getOutstandingInvoices
      tags: [dashboard]
      summary: Get unpaid invoices
      responses:
        "200":
          description: Outstanding invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"

  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List all leads
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [new, contacted, qualified, converted, dead]
        - name: source
          in: query
          schema:
            type: string
            enum: [contact_form, nextdoor, craigslist, referral, vet_card, other]
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a new lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadBody"
      responses:
        "201":
          description: Lead created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a lead by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeadBody"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /leads/{id}/convert:
    post:
      operationId: convertLead
      tags: [leads]
      summary: Convert a lead to a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Client created from lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientBody"
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientBody"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List all jobs
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [quoted, deposit_paid, materials_ordered, scheduled, in_progress, complete, cancelled]
        - name: clientId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobBody"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJobBody"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{id}/invoice:
    post:
      operationId: createInvoiceFromJob
      tags: [jobs]
      summary: Create an invoice from a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceFromJobBody"
      responses:
        "201":
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List all invoices
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, sent, viewed, paid, void]
        - name: clientId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Get an invoice by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
    patch:
      operationId: updateInvoice
      tags: [invoices]
      summary: Update an invoice (mark paid, void, etc)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInvoiceBody"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/token/{token}:
    get:
      operationId: getInvoiceByToken
      tags: [invoices]
      summary: Get a client-facing invoice by token (public)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invoice with business settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoicePublicView"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get business settings
      responses:
        "200":
          description: Business settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update business settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessSettings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessSettings"

  /gallery:
    get:
      operationId: listGalleryItems
      tags: [jobs]
      summary: Get portfolio-approved job photos for public gallery
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [catio, dog_house, kennel, cat_box, tunnel, other]
      responses:
        "200":
          description: Gallery items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GalleryItem"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Note:
      type: object
      properties:
        text:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - text
        - createdAt

    LineItem:
      type: object
      properties:
        description:
          type: string
        amount:
          type: number
          description: Amount in cents
        category:
          type: string
      required:
        - description
        - amount

    Pet:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [cat, dog]
        breed:
          type: string
      required:
        - type

    PetInfo:
      type: object
      properties:
        type:
          type: string
          enum: [cat, dog, both]
        breed:
          type: string
        count:
          type: number
      required:
        - type

    Lead:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        source:
          type: string
          enum: [contact_form, nextdoor, craigslist, referral, vet_card, other]
        message:
          type: string
        photos:
          type: array
          items:
            type: string
        petInfo:
          $ref: "#/components/schemas/PetInfo"
        status:
          type: string
          enum: [new, contacted, qualified, converted, dead]
        notes:
          type: array
          items:
            $ref: "#/components/schemas/Note"
        convertedTo:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - source
        - message
        - status
        - petInfo
        - createdAt
        - updatedAt

    CreateLeadBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        source:
          type: string
          enum: [contact_form, nextdoor, craigslist, referral, vet_card, other]
        message:
          type: string
        petInfo:
          $ref: "#/components/schemas/PetInfo"
      required:
        - name
        - email
        - source
        - message
        - petInfo

    UpdateLeadBody:
      type: object
      properties:
        status:
          type: string
          enum: [new, contacted, qualified, converted, dead]
        notes:
          type: array
          items:
            $ref: "#/components/schemas/Note"
        phone:
          type: string
        address:
          type: string

    Client:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        pets:
          type: array
          items:
            $ref: "#/components/schemas/Pet"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/Note"
        leadId:
          type: string
        jobIds:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - address
        - pets
        - createdAt
        - updatedAt

    CreateClientBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        pets:
          type: array
          items:
            $ref: "#/components/schemas/Pet"
        leadId:
          type: string
      required:
        - name
        - email
        - address
        - pets

    UpdateClientBody:
      type: object
      properties:
        phone:
          type: string
        address:
          type: string
        pets:
          type: array
          items:
            $ref: "#/components/schemas/Pet"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/Note"

    Job:
      type: object
      properties:
        id:
          type: string
        clientId:
          type: string
        clientName:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [catio, dog_house, kennel, cat_box, tunnel, other]
        status:
          type: string
          enum: [quoted, deposit_paid, materials_ordered, scheduled, in_progress, complete, cancelled]
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
        depositAmount:
          type: number
        estimatedDays:
          type: number
        scheduledStart:
          type: string
          format: date-time
        scheduledEnd:
          type: string
          format: date-time
        actualStart:
          type: string
          format: date-time
        actualEnd:
          type: string
          format: date-time
        materialsCost:
          type: number
        materialsNotes:
          type: string
        photos:
          type: array
          items:
            type: string
        portfolioApproved:
          type: boolean
        invoiceIds:
          type: array
          items:
            type: string
        notes:
          type: array
          items:
            $ref: "#/components/schemas/Note"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - clientId
        - title
        - type
        - status
        - lineItems
        - estimatedDays
        - materialsCost
        - portfolioApproved
        - createdAt
        - updatedAt

    CreateJobBody:
      type: object
      properties:
        clientId:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [catio, dog_house, kennel, cat_box, tunnel, other]
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
        estimatedDays:
          type: number
        materialsCost:
          type: number
        scheduledStart:
          type: string
          format: date-time
        scheduledEnd:
          type: string
          format: date-time
      required:
        - clientId
        - title
        - type
        - lineItems
        - estimatedDays
        - materialsCost

    UpdateJobBody:
      type: object
      properties:
        title:
          type: string
        status:
          type: string
          enum: [quoted, deposit_paid, materials_ordered, scheduled, in_progress, complete, cancelled]
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
        scheduledStart:
          type: string
          format: date-time
        scheduledEnd:
          type: string
          format: date-time
        actualStart:
          type: string
          format: date-time
        actualEnd:
          type: string
          format: date-time
        materialsCost:
          type: number
        materialsNotes:
          type: string
        portfolioApproved:
          type: boolean
        notes:
          type: array
          items:
            $ref: "#/components/schemas/Note"

    CreateInvoiceFromJobBody:
      type: object
      properties:
        type:
          type: string
          enum: [deposit, final, full]
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
      required:
        - type

    Invoice:
      type: object
      properties:
        id:
          type: string
        invoiceNumber:
          type: string
        jobId:
          type: string
        clientId:
          type: string
        clientName:
          type: string
        type:
          type: string
          enum: [deposit, final, full]
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
        paymentMethod:
          type: string
          enum: [stripe_ach, stripe_card, zelle, check, bank_transfer, other]
        paymentReference:
          type: string
        token:
          type: string
        sentAt:
          type: string
          format: date-time
        viewedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [draft, sent, viewed, paid, void]
        paidAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - invoiceNumber
        - jobId
        - clientId
        - type
        - lineItems
        - token
        - status
        - createdAt
        - updatedAt

    UpdateInvoiceBody:
      type: object
      properties:
        status:
          type: string
          enum: [draft, sent, viewed, paid, void]
        paymentMethod:
          type: string
          enum: [stripe_ach, stripe_card, zelle, check, bank_transfer, other]
        paymentReference:
          type: string
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"

    InvoicePublicView:
      type: object
      properties:
        invoice:
          $ref: "#/components/schemas/Invoice"
        business:
          $ref: "#/components/schemas/BusinessSettings"
        client:
          $ref: "#/components/schemas/Client"
      required:
        - invoice
        - business
        - client

    BusinessSettings:
      type: object
      properties:
        businessName:
          type: string
        businessAddress:
          type: string
        businessPhone:
          type: string
        businessEmail:
          type: string
        businessLogo:
          type: string
        invoicePrefix:
          type: string
        depositPercent:
          type: number
        taxRate:
          type: number
        stripeEnabled:
          type: boolean
        zelleEnabled:
          type: boolean
        zelleRecipient:
          type: string
        checkEnabled:
          type: boolean
        checkPayableTo:
          type: string
        checkMailingAddress:
          type: string
        bankTransferEnabled:
          type: boolean
        bankName:
          type: string
        bankRoutingNumber:
          type: string
        bankAccountLast4:
          type: string
      required:
        - businessName
        - businessEmail
        - invoicePrefix
        - depositPercent
        - taxRate

    GalleryItem:
      type: object
      properties:
        jobId:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [catio, dog_house, kennel, cat_box, tunnel, other]
        photos:
          type: array
          items:
            type: string
        completedAt:
          type: string
          format: date-time
      required:
        - jobId
        - title
        - type
        - photos

    DashboardSummary:
      type: object
      properties:
        leads:
          type: object
          properties:
            total:
              type: number
            byStatus:
              type: object
              additionalProperties:
                type: number
          required:
            - total
            - byStatus
        jobs:
          type: object
          properties:
            total:
              type: number
            byStatus:
              type: object
              additionalProperties:
                type: number
            activeCount:
              type: number
          required:
            - total
            - byStatus
            - activeCount
        invoices:
          type: object
          properties:
            outstandingCount:
              type: number
            outstandingTotal:
              type: number
            paidThisMonth:
              type: number
            paidThisMonthCount:
              type: number
          required:
            - outstandingCount
            - outstandingTotal
            - paidThisMonth
            - paidThisMonthCount
      required:
        - leads
        - jobs
        - invoices
